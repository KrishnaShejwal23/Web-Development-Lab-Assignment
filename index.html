<!DOCTYPE html>
<html>
<head>
  <title>Student Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Expense Tracker</h2>
    <p class="sub">Track your daily spending smartly</p>

    <div class="total-box">
      <small>Total Money Spent</small>
      <h1>₹<span id="total">0</span></h1>
    </div>

    <h3>Add New Expense</h3>
    <input id="name" placeholder="Expense name">
    <input id="amount" type="number" placeholder="Amount in ₹">

    <select id="category">
      <option value="" disabled selected>Choose category</option>
      <option>Food</option><option>Travel</option>
      <option>Shopping</option><option>Education</option>
      <option>Other</option>
    </select>

    <button onclick="addExpense()">+ Add Expense</button>

    <div class="heading">
      <h3>My Expenses</h3>
      <select id="filter" onchange="showExpenses()">
        <option>All</option><option>Food</option>
        <option>Travel</option><option>Shopping</option>
        <option>Education</option><option>Other</option>
      </select>
    </div>

    <ul id="list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
